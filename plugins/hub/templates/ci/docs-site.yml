# Builds the docs site on pull requests, on pushes to the default branch and when run by hand.
# Deploys to GitHub Pages only on a push to the default branch, when the repository variable
# DOCS_DEPLOY is "pages".
# Pages sites are public unless the organization has private Pages (GitHub Enterprise Cloud).
name: docs-site

on:
  pull_request:
    paths: ['__DOCS_DIR__/**', 'docs-site/**', '.github/workflows/docs-site.yml']
  push:
    branches: ['__DEFAULT_BRANCH__']
    paths: ['__DOCS_DIR__/**', 'docs-site/**', '.github/workflows/docs-site.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-site-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DEPLOY: ${{ github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && vars.DOCS_DEPLOY == 'pages' }}
    defaults:
      run:
        working-directory: docs-site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # "Last updated" dates come from the git history
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: docs-site/.nvmrc
          package-manager-cache: false # no shared cache on a job that can publish
      - run: npm ci --ignore-scripts
      - run: npm run check:diagrams # the build does not catch broken mermaid
      - id: pages
        if: env.DEPLOY == 'true'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - run: npm run build # broken links, anchors and Markdown links fail it
        env:
          DOCS_URL: ${{ steps.pages.outputs.origin }}
          DOCS_BASE_PATH: ${{ steps.pages.outputs.base_path }}
      - if: env.DEPLOY == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs-site/build

  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && vars.DOCS_DEPLOY == 'pages'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
